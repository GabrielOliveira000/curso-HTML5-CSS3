<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{
            height: 100%;
        }

        body{
            background-image: linear-gradient(to top, rgb(255, 191, 0), rgb(244, 47, 47), rgb(246, 90, 116), rgb(0, 110, 255));
            background-attachment: fixed;
        }

        h1{
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.5em;
            text-align: center;
            padding-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
